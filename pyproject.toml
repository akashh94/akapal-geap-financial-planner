[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-planner"
version = "0.1.0"
description = "GEAP Financial Planning agent — goals-based planning via A2A"
requires-python = ">=3.11"
dependencies = [
    # Pin ADK/genai/aiplatform to the versions verified working with Vertex
    # (2.6.2 / 2.17.0 / 1.163.0). Newer aiplatform (1.164+) enables the
    # JSON_SCHEMA_FOR_FUNC_DECL feature which sends `part_metadata` that
    # Gemini Enterprise Agent Platform rejects ("only supported in Gemini
    # Developer API mode").
    "google-adk[gcp,db,a2a]==2.6.2",
    "google-cloud-aiplatform[agent_engines,adk]==1.163.0",
    "google-cloud-firestore",
    "google-genai==2.17.0",
    "python-dotenv",
    "a2a-sdk",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "mcp>=1.24,<2",
]

[project.optional-dependencies]
# Consumed by `agents-cli lint`, which runs `uv sync --dev --extra lint` first.
lint = [
    "ruff",
    "codespell",
    "ty",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "PLW", "C4", "SIM"]
ignore = [
    # Intentional broad excepts for graceful degradation (telemetry/auth fallback).
    "BLE001",
    # False positive: int(os.environ.get("PORT", 8080)) — int() converts the default.
    "PLW1508",
]

[tool.ruff.lint.per-file-ignores]
# Prompt files contain long instructional text; wrapping harms readability.
"app/prompts/*.py" = ["E501"]
